# Decap CMS: editor em /admin, só para mantenedores. Publicar salva o texto direto na main
# (sem PR), então só quem tem acesso de escrita ao repositório consegue salvar.
commit_messages:
  create: 'Novo texto "{{slug}}"'
  update: 'Atualiza texto "{{slug}}"'
  delete: 'Remove texto "{{slug}}"'
  uploadMedia: 'Envia imagem "{{path}}"'
  deleteMedia: 'Remove imagem "{{path}}"'

backend:
  name: github
  repo: tablit/caxingueles
  branch: main
  # Proxy de login (OAuth) hospedado na própria Vercel: ver api/auth.js e api/callback.js.
  base_url: https://caxingueles.eco.br
  auth_endpoint: api/auth

locale: pt

# Pasta e endereço de cada texto: ASCII, sem acento, minúsculas, "_" no lugar de espaços e símbolos.
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "_"

site_url: https://caxingueles.eco.br
display_url: https://caxingueles.eco.br

# Cada texto é uma pasta (content/publicacoes/<texto>/index.md) e suas imagens ficam dentro dela
# (media_folder vazio, definido na coleção). O Hugo reduz e converte as imagens para WebP no build.
# Não há limite de tamanho: o Hugo reduz as imagens ao publicar. O workflow de imagens só recusa HEIC/HEIF.
media_folder: static/img/publicacoes
public_folder: /img/publicacoes

collections:
  - name: publicacoes
    label: Textos
    label_singular: Texto
    folder: content/publicacoes
    create: true
    # Sem o botão de apagar do Decap: ele removeria só o index.md e deixaria as imagens.
    # A lixeira da lista (static/admin/lixeira.js) apaga a pasta inteira.
    delete: false
    extension: md
    format: frontmatter
    # A pasta do texto sai do título: minúsculas, sem acento, "_" entre as palavras, no máximo 50 caracteres.
    # O corte usa "_" como reticências, que o Decap apaga do fim: títulos de até 50 caracteres ficam inteiros,
    # os maiores são cortados em 49.
    slug: "{{title | truncate(49, '_')}}"
    path: "{{slug}}/index"
    media_folder: ""
    public_folder: ""
    # Só entra na lista quem tem tipo: texto. Assim o _index.md da seção não aparece como se fosse um texto.
    filter: { field: tipo, value: texto }
    summary: "{{title}} — {{author}}"
    fields:
      - { label: Tipo, name: tipo, widget: hidden, default: texto }
      - { label: Título, name: title, widget: string }
      - { label: Data, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Autoria, name: author, widget: string, hint: "Como o nome deve aparecer no texto." }
      - label: Categoria
        name: categorias
        widget: select
        multiple: true
        min: 1
        options:
          - { label: Caxinguelês, value: caxingueles }
          - { label: Campo, value: campo }
          - { label: Ensaios, value: ensaios }
          - { label: Resenhas, value: resenhas }
      - { label: Etiquetas, name: tags, widget: list, required: false }
      - { label: Resumo, name: summary, widget: text, hint: "Uma ou duas frases, aparece nos cartões e nas buscas." }
      - label: Imagem de capa
        name: capa
        widget: image
        required: false
        choose_url: false # só envio de arquivo do computador, sem colar endereço
        hint: "Opcional. Aparece no cartão do texto (Início, Publicações e categorias) e no topo do artigo. O site reduz e converte para WebP."
      - { label: Legenda da capa, name: capa_legenda, widget: string, required: false, hint: "Opcional. Aparece sob a imagem no topo do artigo." }
      - { label: Rascunho, name: draft, widget: boolean, default: false, required: false, hint: "Marcado, o texto não vai para o ar." }
      - { label: Texto, name: body, widget: markdown, modes: [rich_text], hint: "Imagens em JPEG ou PNG, com descrição alternativa." }
