<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Caxinguelês · Escrever</title>
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="/admin/lixeira.js"></script>
  <script src="/admin/imagem.js"></script>
  <script>
    // O menu do botão Publicar tem "Publicar e criar novo" e "Publicar e duplicar", que não usamos,
    // e o botão deve publicar direto, sem submenu.
    // O Decap não tem opção para escondê-los (aparecem sempre que criar texto novo é permitido),
    // então removemos os dois itens do menu assim que ele é desenhado.
    (function () {
      // O botão Publicar abre um menu com um único item, "Publicar agora". Para ele funcionar como um
      // botão simples, clicamos nesse item sozinhos logo depois do clique em Publicar.
      var cliqueEmPublicar = 0;
      var botaoPublicar = /^(publicar|publish)$/i;
      var publicarAgora = /^(publicar agora|publish now)$/i;
      document.addEventListener('click', function (e) {
        var botao = e.target.closest && e.target.closest('button');
        if (botao && botaoPublicar.test((botao.textContent || '').trim())) cliqueEmPublicar = Date.now();
      }, true);
      var sobrando = /^(publicar e (criar novo|duplicar)|publish and (create new|duplicate))$/i;
      var porUrl = /^(insert from url|inserir (de|da|por|via) url|inserir url)$/i;
      function limpar() {
        document.querySelectorAll('li, [role="menuitem"]').forEach(function (el) {
          if (sobrando.test((el.textContent || '').trim())) el.style.display = 'none';
        });
        document.querySelectorAll('li, [role="menuitem"]').forEach(function (el) {
          if (cliqueEmPublicar && Date.now() - cliqueEmPublicar < 1500 && publicarAgora.test((el.textContent || '').trim())) {
            cliqueEmPublicar = 0;
            if (el.parentElement) el.parentElement.style.visibility = 'hidden';
            el.click();
          }
        });
        // A seção "Mídia" do menu do topo (biblioteca solta de imagens) não é usada: as imagens
        // pertencem a cada texto. O Decap não tem opção para escondê-la.
        document.querySelectorAll('a[href="#/media"]').forEach(function (el) { el.style.display = 'none'; });
        // Rede de segurança: o botão de imagem por endereço não deve aparecer em lugar nenhum.
        document.querySelectorAll('button').forEach(function (el) {
          if (porUrl.test((el.textContent || '').trim())) el.style.display = 'none';
        });
      }
      new MutationObserver(limpar).observe(document.body, { childList: true, subtree: true });
      limpar();
    })();
  </script>
</body>
</html>
