# -- Opcoes do tema Congo --
# https://jpanther.github.io/congo/docs/configuration/#theme-parameters

colorScheme = "congo"
defaultAppearance = "light"
autoSwitchAppearance = true

enableSearch = false
enableCodeCopy = false
enableImageLazyLoading = true
enableImageWebp = true

fingerprintAlgorithm = "sha256"

[header]
  layout = "basic"
  showTitle = true

[footer]
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "page"
  showRecent = true
  recentLimit = 6

[article]
  showDate = true
  showAuthor = true
  showDraftLabel = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showTableOfContents = false
  showTaxonomies = true
  showWordCount = false
  showComments = false

[list]
  showSummary = true
  groupByYear = false
  paginationWidth = 1

[taxonomy]
  showTermCount = true

[contato]
  # Id do formulario criado em tally.so (o trecho final da URL de embed).
  # Vazio = a pagina de contato mostra um aviso no lugar do formulario.
  tallyFormId = "VL2jZN"
