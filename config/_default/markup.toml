# -- Markup --

[goldmark]
[goldmark.parser]
  # Imagem sozinha num parágrafo vira bloco (render-image.html usa .IsBlock para gerar a figura).
  wrapStandAloneImageWithinParagraph = false
[goldmark.renderer]
  unsafe = true
[goldmark.extensions]
[goldmark.extensions.passthrough]
  enable = true
[goldmark.extensions.passthrough.delimiters]
  block = [['\[', '\]'], ['$$', '$$']]
  inline = [['\(', '\)']]

[highlight]
  noClasses = false

[tableOfContents]
  startLevel = 2
  endLevel = 3
  ordered = true
