name: Formato das imagens

# Falha se uma imagem HEIC/HEIF for adicionada (o Hugo não lê esses formatos). Não há limite de tamanho:
# o Hugo reduz as imagens ao publicar. Em push na main (textos do editor) o aviso vem depois do commit.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  imagens:
    name: Imagens em formato aceito
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conferir formatos
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          erro=0
          # O Hugo não lê HEIC/HEIF (fotos de iPhone): o texto ficaria sem imagem.
          while IFS= read -r arquivo; do
            echo "::error file=$arquivo::$arquivo é HEIC/HEIF, que o site não processa. Exporte como JPEG ou PNG."
            erro=1
          done < <(git diff --name-only --diff-filter=AM "$BASE" "$HEAD" -- 'static/img' 'assets/img' 'content' | grep -iE '\.(heic|heif)$')
          exit $erro
